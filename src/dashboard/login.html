<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0f;overflow:hidden;position:relative}
.bg-mesh{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 60% at 0% 20%,rgba(88,101,242,0.15) 0%,transparent 50%),radial-gradient(ellipse 60% 50% at 100% 80%,rgba(88,101,242,0.12) 0%,transparent 50%),radial-gradient(ellipse 50% 40% at 50% 50%,rgba(120,80,200,0.08) 0%,transparent 50%);animation:bgShift 12s ease-in-out infinite alternate}
@keyframes bgShift{0%{transform:scale(1) rotate(0deg)}100%{transform:scale(1.08) rotate(2deg)}}
.floating{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.float-el{position:absolute;border-radius:50%;background:rgba(88,101,242,0.08);animation:floatEl linear infinite}
@keyframes floatEl{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) scale(1.5);opacity:0}}
.login-card{position:relative;z-index:1;background:rgba(15,15,25,0.7);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border:1px solid rgba(255,255,255,0.06);border-radius:32px;padding:56px 48px;width:420px;max-width:90vw;box-shadow:0 0 100px rgba(88,101,242,0.08),inset 0 1px 0 rgba(255,255,255,0.05);animation:fadeUp 0.6s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.icon-wrap{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#5865F2,#7850c8);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:0 8px 32px rgba(88,101,242,0.3);position:relative}
.icon-wrap svg{width:32px;height:32px;color:#fff}
.login-card h1{color:#fff;font-size:26px;font-weight:800;text-align:center;letter-spacing:-0.5px}
.login-card .sub{color:rgba(255,255,255,0.35);text-align:center;margin-bottom:36px;font-size:14px;font-weight:400}
.inp-grp{margin-bottom:20px}
.inp-grp label{display:block;color:rgba(255,255,255,0.4);font-size:11px;font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.inp-grp input{width:100%;padding:16px 18px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;color:#fff;font-size:15px;outline:none;transition:all 0.25s;font-family:inherit}
.inp-grp input:focus{border-color:#5865F2;background:rgba(88,101,242,0.06);box-shadow:0 0 24px rgba(88,101,242,0.08)}
.inp-grp input::placeholder{color:rgba(255,255,255,0.15)}
.btn{width:100%;padding:16px;background:linear-gradient(135deg,#5865F2,#7850c8);border:none;border-radius:14px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.25s;font-family:inherit;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(88,101,242,0.3)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.btn .spin{display:none;width:20px;height:20px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.6s linear infinite;margin:0 auto}
.btn.loading .spin{display:block}
.btn.loading .btn-txt{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:#ed4245;font-size:13px;text-align:center;margin-top:16px;display:none;padding:10px;background:rgba(237,66,69,0.08);border-radius:10px;border:1px solid rgba(237,66,69,0.12)}
.err.show{display:block}
.ft{text-align:center;margin-top:24px;color:rgba(255,255,255,0.15);font-size:12px}
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="floating" id="floatContainer"></div>
<div class="login-card">
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4" ry="4"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
  </div>
  <h1>Dashboard</h1>
  <p class="sub">Enter your password to access the control panel</p>
  <form id="loginForm">
    <div class="inp-grp"><label>Password</label><input type="password" id="password" placeholder="Enter dashboard password..." autofocus></div>
    <button type="submit" class="btn" id="loginBtn"><span class="btn-txt">Sign In</span><div class="spin"></div></button>
    <div class="err" id="errorMsg">Invalid password. Please try again.</div>
  </form>
  <p class="ft">Bot Management System</p>
</div>
<script>
for(let i=0;i<40;i++){const p=document.createElement('div');p.className='float-el';p.style.left=Math.random()*100+'%';p.style.width=p.style.height=(2+Math.random()*6)+'px';p.style.animationDuration=(8+Math.random()*25)+'s';p.style.animationDelay=(Math.random()*25)+'s';document.getElementById('floatContainer').appendChild(p)}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const pwd=document.getElementById('password').value;const btn=document.getElementById('loginBtn');const err=document.getElementById('errorMsg');btn.classList.add('loading');err.classList.remove('show');try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd})});const d=await r.json();if(d.success){document.cookie='session='+d.token+';path=/;max-age=86400;SameSite=Lax';window.location.href='/'}else{err.textContent='Invalid password.';err.classList.add('show');document.getElementById('password').value='';document.getElementById('password').focus()}}catch{err.textContent='Connection error.';err.classList.add('show')}
btn.classList.remove('loading')});
</script>
</body>
</html>
